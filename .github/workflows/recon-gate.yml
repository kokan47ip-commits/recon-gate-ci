name: recon-gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recon-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate action pins
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS=: read -r file line_no content; do
            ref="${content#*uses:}"
            ref="${ref%%#*}"
            ref="$(printf '%s' "$ref" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$ref" in
              ./*) continue ;;
            esac
            if [[ ! "$ref" =~ ^[^@]+@[0-9a-f]{40}$ ]]; then
              echo "::error file=$file,line=$line_no::Action must be pinned to a full 40-character commit SHA: $ref"
              bad=1
            fi
          done < <(grep -RInE '^[[:space:]]*(-[[:space:]]*)?uses:' .github/workflows --include='*.yml' --include='*.yaml' || true)
          exit "$bad"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-16 postgresql-client-16

      - name: Installer tests
        run: bash tests/recon-installer.test.sh

      - name: PostgreSQL gate tests
        run: |
          PG_BINDIR="/usr/lib/postgresql/16/bin"
          PSQL="$PG_BINDIR/psql"
          "$PSQL" --version
          "$PG_BINDIR/postgres" --version
          PG_BINDIR="$PG_BINDIR" PSQL="$PSQL" bash tests/recon-gate-postgres.test.sh
