name: recon-gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recon-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate action pins
        run: bash .github/scripts/check-action-pins.sh .github/workflows

      - name: Self-test action-pin guard
        run: bash .github/scripts/check-action-pins.test.sh

      - name: Check privileged checkout triggers
        run: bash .github/scripts/check-privileged-checkout.sh .github/workflows

      - name: Self-test privileged checkout guard
        run: bash .github/scripts/check-privileged-checkout.test.sh

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "/tmp/${archive}" | sha256sum --check -
          sudo tar --extract --gzip --file "/tmp/${archive}" --directory /usr/local/bin actionlint
          actionlint -version

      - name: Run actionlint
        run: actionlint -shellcheck=

      - name: Install shell linters
        env:
          SHELLCHECK_VERSION: "0.10.0"
          SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
          SHFMT_VERSION: "3.10.0"
          SHFMT_SHA256: "1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc"
        run: |
          set -euo pipefail
          shellcheck_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${shellcheck_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${shellcheck_archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "/tmp/${shellcheck_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${shellcheck_archive}" --directory /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

          shfmt_binary="shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl --fail --silent --show-error --location \
            --output "/tmp/${shfmt_binary}" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${shfmt_binary}"
          printf '%s  %s\n' "$SHFMT_SHA256" "/tmp/${shfmt_binary}" | sha256sum --check -
          sudo install -m 0755 "/tmp/${shfmt_binary}" /usr/local/bin/shfmt

          shellcheck --version
          shfmt --version

      - name: Run ShellCheck
        run: shellcheck .github/scripts/*.sh tests/*.sh artifacts/*.sh recon-gate-bootstrap.sh

      - name: Check workflow/installer shell formatting
        run: shfmt -d -i 2 -ci .github/scripts/*.sh artifacts/*.sh recon-gate-bootstrap.sh

      - name: Archive helper tests
        run: bash artifacts/test-find-and-archive-hajj-umrah.sh

      - name: Archive inspector tests
        run: bash artifacts/test-inspect-archive.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Assert Node 22 is active
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const major = process.versions.node.split(".")[0]; if (major !== "22") { console.error(`expected Node 22, got ${process.version}`); process.exit(1); }'

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-16 postgresql-client-16

      - name: Installer tests
        run: bash tests/recon-installer.test.sh

      - name: PostgreSQL gate tests
        run: |
          PG_BINDIR="/usr/lib/postgresql/16/bin"
          PSQL="$PG_BINDIR/psql"
          "$PSQL" --version
          "$PG_BINDIR/postgres" --version
          PG_BINDIR="$PG_BINDIR" PSQL="$PSQL" bash tests/recon-gate-postgres.test.sh

  archive-helper-bsdtar:
    # Pinned image: macos-latest currently resolves to macOS 26 arm64, but a
    # floating label would silently move the bsdtar/libarchive coverage to a new
    # OS image. Bump this deliberately, as with ubuntu-24.04 above.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the system tar is bsdtar
        run: |
          set -euo pipefail
          tar --version
          tar --version | grep -q bsdtar

      - name: Archive helper tests (bsdtar)
        run: bash artifacts/test-find-and-archive-hajj-umrah.sh

      - name: Archive inspector tests (bsdtar)
        run: bash artifacts/test-inspect-archive.sh
